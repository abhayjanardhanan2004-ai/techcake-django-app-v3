version: 0.0
os: linux

hooks:
  BeforeInstall:
    - location: scripts/stop_container.sh
      timeout: 60
      runas: root

  AfterInstall:
    - location: scripts/deploy_container.sh
      timeout: 300
      runas: root

  ApplicationStart:
    - location: scripts/start_container.sh
      timeout: 60
      runas: root

  ValidateService:
    - location: scripts/validate_service.sh
      timeout: 120
      runas: root
