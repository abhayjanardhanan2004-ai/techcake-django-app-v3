
version: 0.0
os: linux

files:
  - source: /
    destination: /opt/techcake-app

permissions:
  - object: /opt/techcake-app
    pattern: "**"
    owner: root
    group: root
    mode: 755

hooks:
  ApplicationStop:
    - location: deploy/stop.sh
      timeout: 60
      runas: root

  BeforeInstall:
    - location: deploy/install.sh
      timeout: 120
      runas: root

  AfterInstall:
    - location: deploy/start.sh
      timeout: 300
      runas: root

  ValidateService:
    - location: deploy/validate.sh
      timeout: 180
      runas: root
