version: 0.0
os: linux

files:
  - source: /
    destination: /opt/techcake-app

permissions:
  - object: /opt/techcake-app/deploy
    pattern: "*.sh"
    owner: root
    group: root
    mode: 755
    type:
      - file

hooks:
  BeforeInstall:
    - location: deploy/install.sh
      timeout: 120
      runas: root

  ApplicationStart:
    - location: deploy/start.sh
      timeout: 300
      runas: root

  ValidateService:
    - location: deploy/validate.sh
      timeout: 180
      runas: root


