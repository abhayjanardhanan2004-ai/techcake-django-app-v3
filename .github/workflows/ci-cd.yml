name: Django CI-CD with Trivy

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  test:
    name: Django tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Django tests
        env:
          DB_ENGINE: sqlite
        run: python manage.py test

  build-scan:
    name: Build and scan Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize scan report
        run: |
          echo '{"status":"scan_not_completed"}' > trivy-report.json

      - name: Build Docker image
        run: |
          docker build \
            --build-arg APP_VERSION=${{ github.sha }} \
            -t techcake-v3:${{ github.sha }} .

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: techcake-v3:${{ github.sha }}
          format: json
          output: trivy-report.json
          severity: HIGH,CRITICAL
          exit-code: '0'

      - name: Upload Trivy scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-scan-report-${{ github.sha }}
          path: trivy-report.json
          if-no-files-found: error
          retention-days: 30

      - name: Block CRITICAL vulnerabilities
        run: |
          if jq -e '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length == 0' trivy-report.json >/dev/null; then
            echo "PASS: No CRITICAL vulnerabilities found"
          else
            echo "FAIL: CRITICAL vulnerabilities detected"
            exit 1
          fi

      - name: Save scanned Docker image
        run: |
          docker save -o image.tar techcake-v3:${{ github.sha }}

      - name: Upload scanned Docker image
        uses: actions/upload-artifact@v4
        with:
          name: scanned-image-${{ github.sha }}
          path: image.tar
          retention-days: 1

  publish-main:
    name: Push scanned image to ECR
    needs:
      - test
      - build-scan

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download scanned image
        uses: actions/download-artifact@v4
        with:
          name: scanned-image-${{ github.sha }}
          path: ./image-artifact

      - name: Load scanned Docker image
        run: docker load -i image-artifact/image.tar

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::451782721864:role/GitHubActionsECRPushRole
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag scanned image for ECR
        run: |
          docker tag techcake-v3:${{ github.sha }} \
            451782721864.dkr.ecr.ap-south-1.amazonaws.com/techcake-django-app-v3:${{ github.sha }}

      - name: Push scanned image to ECR
        run: |
          docker push \
            451782721864.dkr.ecr.ap-south-1.amazonaws.com/techcake-django-app-v3:${{ github.sha }}

